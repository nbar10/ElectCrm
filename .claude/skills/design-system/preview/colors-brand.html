<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}
body{padding:24px 28px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.s{display:flex;flex-direction:column;gap:6px}
.chip{aspect-ratio:1;border-radius:12px;border:1px solid var(--border-1)}
.n{font-size:11px;font-weight:600;letter-spacing:.04em}
.h{font-size:10px;color:var(--fg-2);font-family:ui-monospace,'SF Mono',monospace;text-transform:uppercase}
</style></head><body>
<div class="grid">
  <div class="s"><div class="chip" style="background:#C2AE92"></div><div class="n">Gold</div><div class="h">#C2AE92</div></div>
  <div class="s"><div class="chip" style="background:#B09D81"></div><div class="n">Gold Hover</div><div class="h">#B09D81</div></div>
  <div class="s"><div class="chip" style="background:#03252F"></div><div class="n">Navy</div><div class="h">#03252F</div></div>
  <div class="s"><div class="chip" style="background:#002E3B"></div><div class="n">Navy Light</div><div class="h">#002E3B</div></div>
  <div class="s"><div class="chip" style="background:#1E1E1C"></div><div class="n">Off-Black</div><div class="h">#1E1E1C</div></div>
  <div class="s"><div class="chip" style="background:#F3F1EE;border-color:rgba(0,0,0,.12)"></div><div class="n">Off-White</div><div class="h">#F3F1EE</div></div>
</div>
</body></html>
