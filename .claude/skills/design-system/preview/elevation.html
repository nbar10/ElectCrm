<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1)}
body{padding:32px 28px;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{background:#fff;border:1px solid var(--border-1);border-radius:12px;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.v{font-size:10px;color:var(--fg-2);font-family:ui-monospace,monospace;margin-top:2px}
</style></head><body>
<div class="grid">
  <div class="card" style="box-shadow:0 1px 2px rgba(0,0,0,.05)"><div class="l">Shadow sm</div><div class="v">resting cards</div></div>
  <div class="card" style="box-shadow:0 4px 12px rgba(0,0,0,.08)"><div class="l">Shadow md</div><div class="v">hovered cards</div></div>
  <div class="card" style="box-shadow:0 12px 24px rgba(0,0,0,.12)"><div class="l">Shadow lg</div><div class="v">elevated panels</div></div>
  <div class="card" style="box-shadow:0 20px 40px rgba(0,0,0,.15)"><div class="l">Shadow xl</div><div class="v">login modal</div></div>
</div>
</body></html>
