<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;color:var(--fg-1);font-family:var(--font-body);font-size:14px}
body{padding:0}
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--fg-2);font-weight:600;padding:.875rem 1rem;border-bottom:2px solid var(--border-1);background:var(--offwhite);text-align:left}
td{padding:1rem;border-bottom:1px solid var(--border-1);font-size:.9rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--offwhite)}
.score{font-family:'DM Serif Display',serif;color:var(--gold);font-weight:500}
.b{font-size:11px;font-weight:600;padding:.3em .7em;border-radius:6px;background:#E8F3F0;color:#2D5F4F;border:1px solid rgba(90,140,124,.25)}
</style></head><body>
<table>
  <thead><tr><th>Council</th><th>Region</th><th>Status</th><th style="text-align:right">Score</th></tr></thead>
  <tbody>
    <tr><td>Durham County Council</td><td>North East</td><td><span class="b">Active</span></td><td style="text-align:right" class="score">94</td></tr>
    <tr><td>Waltham Forest</td><td>London</td><td><span class="b">Active</span></td><td style="text-align:right" class="score">88</td></tr>
    <tr><td>Rotherham Council</td><td>South Yorkshire</td><td><span class="b">Active</span></td><td style="text-align:right" class="score">82</td></tr>
  </tbody>
</table>
</body></html>
