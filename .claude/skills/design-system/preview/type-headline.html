<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1)}
body{padding:24px 28px;font-family:var(--font-body)}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);font-weight:600;margin-bottom:10px}
h3,h4,h5{font-family:'Akzidenz Grotesk BE EX','Helvetica Neue',sans-serif;text-transform:uppercase;font-weight:500;margin:0 0 8px;color:var(--fg-1)}

h5{font-size:16px;letter-spacing:.14em}
.meta{font-size:11px;color:var(--fg-2);font-family:ui-monospace,monospace;margin-top:8px}
.meta b{color:var(--fg-1);font-family:var(--font-body);font-weight:600}

<div class="eyebrow">H3 – H5 — Akzidenz Grotesk BE EX · Uppercase</div>
<h3>Evidence over exaggeration</h3>
<h4>Track delivery against committed targets</h4>
<h5>Council priorities · Local impact</h5>
<div class="meta"><b>Akzidenz Grotesk BE EX</b> · 500 Medium Extended · UPPERCASE · tracked</div>
