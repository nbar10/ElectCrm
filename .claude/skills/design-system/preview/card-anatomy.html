<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1);font-family:var(--font-body)}
body{padding:24px 28px}
.card{background:#fff;border:1px solid var(--border-1);border-radius:12px;padding:1.5rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border-1)}
.card-title{font-size:1rem;font-weight:600}
.b{font-size:11px;font-weight:600;padding:.3em .7em;border-radius:6px;background:#F5F0EA;color:#9A865B;border:1px solid rgba(194,174,146,.3)}
.body{font-size:14px;color:var(--fg-2);line-height:1.6}
</style></head><body>
<div class="card">
  <div class="h"><div class="card-title">Durham County Council — 0–25 Family Health</div><span class="b">Premium</span></div>
  <div class="body">Standard card pattern: white surface, 12 px radius, hairline border, 24 px padding, header with bottom hairline divider, sm shadow at rest. Hovers up to <code>shadow-md</code>.</div>
</div>
</body></html>
