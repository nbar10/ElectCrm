<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}
body{padding:22px 28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{border-radius:12px;padding:18px;border:1px solid var(--border-1)}
.panel h6{font-size:10px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;margin:0 0 10px;font-family:var(--font-body)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border-1);font-size:13px}
.row:last-child{border-bottom:none}
.row code{font-family:ui-monospace,'SF Mono',monospace;font-size:11px;opacity:.6}
.dark{background:var(--bg-dark);color:#fff}
.dark h6{color:rgba(255,255,255,.5)}
.dark .row{border-color:rgba(255,255,255,.08)}
</style></head><body>
<div class="panel" style="background:var(--bg-surface)">
  <h6>On Light Surface</h6>
  <div class="row" style="color:var(--fg-1)"><span>Primary text</span><code>fg-1</code></div>
  <div class="row" style="color:var(--fg-2)"><span>Muted text</span><code>fg-2</code></div>
  <div class="row" style="color:var(--gold)"><span>Accent / link</span><code>gold</code></div>
</div>
<div class="panel dark">
  <h6>On Dark Surface</h6>
  <div class="row" style="color:rgba(255,255,255,.92)"><span>Primary text</span><code>fg-on-dark-1</code></div>
  <div class="row" style="color:rgba(255,255,255,.70)"><span>Muted text</span><code>fg-on-dark-2</code></div>
  <div class="row" style="color:var(--gold)"><span>Accent / active</span><code>gold</code></div>
</div>
</body></html>
