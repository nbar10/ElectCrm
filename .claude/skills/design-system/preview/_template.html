<style>
html, body { margin: 0; padding: 0; background: var(--bg-page); }
body { padding: 28px 32px; font-family: var(--font-body); color: var(--fg-1); }
.row { display: flex; gap: 16px; align-items: stretch; }
.col { display: flex; flex-direction: column; gap: 8px; }

.swatch.lg { width: 120px; height: 120px; }
.swatch-meta { font-size: 11px; line-height: 1.4; color: var(--fg-2); font-family: ui-monospace, 'SF Mono', monospace; }
.swatch-meta b { color: var(--fg-1); font-family: var(--font-body); display: block; font-size: 12px; margin-bottom: 2px; font-weight: 600; }
.specimen { font-family: var(--font-display); font-size: 64px; line-height: 0.95; letter-spacing: -0.005em; text-transform: uppercase; }
.label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-2); font-weight: 600; margin-bottom: 6px; }
</style>
