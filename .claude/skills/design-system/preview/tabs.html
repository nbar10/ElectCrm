<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;color:var(--fg-1);font-family:var(--font-body)}
body{padding:24px 28px}
.tabs{display:flex;gap:.25rem;border-bottom:2px solid var(--border-1);margin-bottom:1.5rem}
.t{padding:.75rem 1.5rem;font-size:.9rem;font-weight:500;color:var(--fg-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.t:hover{color:var(--fg-1)}
.t.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.cnt{font-size:13px;color:var(--fg-2)}
</style></head><body>
<div class="tabs">
  <div class="t active">Overview</div>
  <div class="t">Commitments</div>
  <div class="t">Delivery</div>
  <div class="t">Evidence</div>
  <div class="t">Reports</div>
</div>
<div class="cnt">Underline tabs — gold underline on active, 2 px border. Subtle hover changes color to off-black only.</div>
</body></html>
