<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1);font-family:var(--font-body)}
body{padding:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.b{font-size:12px;font-weight:600;padding:.45em .9em;border-radius:6px;letter-spacing:.3px;border:1px solid transparent;display:inline-block}
.success{background:#E8F3F0;color:#2D5F4F;border-color:rgba(90,140,124,.25)}
.warning{background:#FAF2EC;color:#8B5E3C;border-color:rgba(201,149,107,.25)}
.danger{background:#F8EDED;color:#7A3535;border-color:rgba(162,91,91,.25)}
.info{background:#EDF2F6;color:#3F5C72;border-color:rgba(107,139,163,.25)}
.primary{background:#F5F0EA;color:#9A865B;border-color:rgba(194,174,146,.3)}
.secondary{background:#F1F0EF;color:#5A5856;border-color:rgba(30,30,28,.15)}
.light{background:#fff;color:var(--fg-2);border-color:var(--border-2)}
</style></head><body>
<span class="b success">Verified</span>
<span class="b warning">Pending</span>
<span class="b danger">Overdue</span>
<span class="b info">In Review</span>
<span class="b primary">Premium</span>
<span class="b secondary">Draft</span>
<span class="b light">Archived</span>
</body></html>
