<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1)}
body{padding:24px 28px;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cell{display:flex;flex-direction:column;gap:6px;align-items:center}
.box{width:100%;aspect-ratio:1;background:var(--bg-surface);border:1px solid var(--border-2)}
.lbl{font-size:11px;font-weight:600}
.val{font-size:10px;color:var(--fg-2);font-family:ui-monospace,monospace}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="lbl">xs</div><div class="val">4 px</div></div>
  <div class="cell"><div class="box" style="border-radius:6px"></div><div class="lbl">sm</div><div class="val">6 px</div></div>
  <div class="cell"><div class="box" style="border-radius:8px"></div><div class="lbl">md</div><div class="val">8 px</div></div>
  <div class="cell"><div class="box" style="border-radius:12px"></div><div class="lbl">lg</div><div class="val">12 px</div></div>
  <div class="cell"><div class="box" style="border-radius:16px"></div><div class="lbl">xl</div><div class="val">16 px</div></div>
  <div class="cell"><div class="box" style="border-radius:999px"></div><div class="lbl">pill</div><div class="val">999 px</div></div>
</div>
</body></html>
