<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1);font-family:var(--font-body)}
body{padding:28px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.kpi{background:#fff;border:1px solid var(--border-1);border-radius:12px;padding:1.5rem 1.75rem;display:flex;align-items:center;gap:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.icon.gold{background:rgba(194,174,146,.15);color:#C2AE92}
.icon.green{background:rgba(90,140,124,.15);color:#5A8C7C}
.icon.blue{background:rgba(3,37,47,.1);color:#03252F}
.v{font-family:'DM Serif Display',serif;font-size:2rem;font-weight:500;line-height:1;color:var(--fg-1)}
.l{font-size:.8rem;color:var(--fg-2);margin-top:4px}
</style></head><body>
<div class="kpi"><div class="icon gold"><i class="bi bi-graph-up-arrow"></i></div><div><div class="v">£4.3M</div><div class="l">Social value delivered</div></div></div>
<div class="kpi"><div class="icon green"><i class="bi bi-people"></i></div><div><div class="v">1,247</div><div class="l">Local jobs created</div></div></div>
<div class="kpi"><div class="icon blue"><i class="bi bi-buildings"></i></div><div><div class="v">62</div><div class="l">Active partners</div></div></div>
</body></html>
