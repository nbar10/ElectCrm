<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1)}
body{padding:24px 28px;font-family:var(--font-body)}
.row{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.tok{width:64px;font-size:11px;font-family:ui-monospace,monospace;color:var(--fg-2)}
.bar{background:var(--gold);height:14px;border-radius:3px}
.val{font-size:11px;color:var(--fg-2);font-family:ui-monospace,monospace;margin-left:8px}
</style></head><body>
<div class="row"><div class="tok">space-1</div><div class="bar" style="width:4px"></div><div class="val">4 px</div></div>
<div class="row"><div class="tok">space-2</div><div class="bar" style="width:8px"></div><div class="val">8 px</div></div>
<div class="row"><div class="tok">space-3</div><div class="bar" style="width:12px"></div><div class="val">12 px</div></div>
<div class="row"><div class="tok">space-4</div><div class="bar" style="width:16px"></div><div class="val">16 px</div></div>
<div class="row"><div class="tok">space-5</div><div class="bar" style="width:24px"></div><div class="val">24 px</div></div>
<div class="row"><div class="tok">space-6</div><div class="bar" style="width:32px"></div><div class="val">32 px</div></div>
<div class="row"><div class="tok">space-7</div><div class="bar" style="width:48px"></div><div class="val">48 px</div></div>
<div class="row"><div class="tok">space-8</div><div class="bar" style="width:64px"></div><div class="val">64 px</div></div>
<div class="row"><div class="tok">space-9</div><div class="bar" style="width:96px"></div><div class="val">96 px</div></div>
</body></html>
