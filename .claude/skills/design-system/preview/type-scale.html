<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1)}
body{padding:22px 28px;font-family:var(--font-body)}
.row{display:grid;grid-template-columns:80px 1fr 110px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border-1);gap:16px}
.row:last-child{border-bottom:none}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--fg-2)}
.spec{}
.spec.serif{font-family:'Moneta',Georgia,serif;text-transform:uppercase;line-height:1;font-weight:400}
.spec.ext{font-family:'Akzidenz Grotesk BE EX','Helvetica Neue',sans-serif;text-transform:uppercase;font-weight:500}
.spec.body{font-family:var(--font-body)}
.size{font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-2);text-align:right}
</style></head><body>
<div class="row"><div class="tag">H1</div><div class="spec serif" style="font-size:48px">Workforce</div><div class="size">56 / Moneta</div></div>
<div class="row"><div class="tag">H2</div><div class="spec serif" style="font-size:36px">For Good</div><div class="size">40 / Moneta</div></div>
<div class="row"><div class="tag">H3</div><div class="spec ext" style="font-size:24px;letter-spacing:.06em">Evidence-Led</div><div class="size">28 / Akz EX</div></div>
<div class="row"><div class="tag">H4</div><div class="spec ext" style="font-size:18px;letter-spacing:.14em">Council Priorities</div><div class="size">20 / Akz EX</div></div>
<div class="row"><div class="tag">H5</div><div class="spec ext" style="font-size:14px;letter-spacing:.14em">Section Heading</div><div class="size">16 / Akz EX</div></div>
<div class="row"><div class="tag">Body</div><div class="spec body" style="font-size:15px">The default body size across the system.</div><div class="size">15 / DM Sans</div></div>
</body></html>
