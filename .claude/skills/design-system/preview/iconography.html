<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
html,body{margin:0;background:var(--bg-page);color:var(--fg-1);font-family:var(--font-body)}
body{padding:24px 28px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);font-weight:600;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:12px;margin-bottom:16px}
.ico{width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--border-1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--fg-1)}
.note{font-size:11px;color:var(--fg-2);font-family:ui-monospace,monospace}
</style></head><body>
<div class="eyebrow">Bootstrap Icons · CDN</div>
<div class="grid">
  <div class="ico"><i class="bi bi-grid-1x2"></i></div>
  <div class="ico"><i class="bi bi-bullseye"></i></div>
  <div class="ico"><i class="bi bi-graph-up-arrow"></i></div>
  <div class="ico"><i class="bi bi-people"></i></div>
  <div class="ico"><i class="bi bi-clipboard-data"></i></div>
  <div class="ico"><i class="bi bi-basket"></i></div>
  <div class="ico"><i class="bi bi-buildings"></i></div>
  <div class="ico"><i class="bi bi-calendar-check"></i></div>
  <div class="ico"><i class="bi bi-shield-check"></i></div>
  <div class="ico"><i class="bi bi-cloud-upload"></i></div>
</div>
<div class="note">bootstrap-icons@1.11.3 · monoline · inherit color · 1rem inline / 1.4rem in KPI tiles</div>
</body></html>
